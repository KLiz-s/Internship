name: CI/CD for OrderService with Sonar & Docker

on:
  push:
    branches:
      - main
      - dev
      - 'feat-*'
      - 'feature-*'

jobs:
  build-test-analysis:
    name: Build, Test and Analyze Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: order-service
        run: chmod +x ./gradlew

      - name: Build project and run tests
        working-directory: order-service
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ORDER_SERVICE_POSTGRES_DB: ${{ secrets.ORDER_SERVICE_POSTGRES_DB }}
          ORDER_SERVICE_POSTGRES_USER: ${{ secrets.ORDER_SERVICE_POSTGRES_USER }}
          ORDER_SERVICE_POSTGRES_PASSWORD: ${{ secrets.ORDER_SERVICE_POSTGRES_PASSWORD }}
          ORDER_SERVICE_POSTGRES_PORT: ${{ secrets.ORDER_SERVICE_POSTGRES_PORT }}
          ORDER_SERVICE_SERVICE_PORT: ${{ secrets.ORDER_SERVICE_SERVICE_PORT }}
          USER_SERVICE_URL: ${{ secrets.SERVICES_ADDRESS_PREFIX }}:${{ secrets.USER_SERVICE_SERVICE_PORT }}
        run: ./gradlew build

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarQube Quality Analysis
        working-directory: order-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew sonar --info

  docker-artifact:
    name: Create and Push Docker Image Artifact
    needs: build-test-analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code for Docker build
        uses: actions/checkout@v4

      - name: Set up JDK 21 for Artifact
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: order-service
        run: chmod +x ./gradlew

      - name: Assemble Release JAR Package
        working-directory: order-service
        run: ./gradlew assemble --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/order-service
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Final Docker Image
        uses: docker/build-push-action@v6
        with:
          context: order-service
          file: order-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
