services:

  # =========================
  # User Service
  # =========================

  user-postgres:
    image: postgres:17
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: ${USER_SERVICE_POSTGRES_DB}
      POSTGRES_USER: ${USER_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_SERVICE_POSTGRES_PASSWORD}
    ports:
      - "${USER_SERVICE_POSTGRES_PORT}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${USER_SERVICE_POSTGRES_USER} -d ${USER_SERVICE_POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: user-service-redis
    ports:
      - "${USER_SERVICE_REDIS_PORT}:6379"
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    depends_on:
      user-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://user-postgres:5432/${USER_SERVICE_POSTGRES_DB}
      DB_USERNAME: ${USER_SERVICE_POSTGRES_USER}
      DB_PASSWORD: ${USER_SERVICE_POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: ${USER_SERVICE_REDIS_PORT}

      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${USER_SERVICE_SERVICE_PORT}:${USER_SERVICE_SERVICE_PORT}"
    restart: unless-stopped


  # =========================
  # Auth Service
  # =========================

  auth-postgres:
    image: postgres:17
    container_name: auth-service-postgres
    environment:
      POSTGRES_DB: ${AUTH_SERVICE_POSTGRES_DB}
      POSTGRES_USER: ${AUTH_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_SERVICE_POSTGRES_PASSWORD}
    ports:
      - "${AUTH_SERVICE_POSTGRES_PORT}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTH_SERVICE_POSTGRES_USER} -d ${AUTH_SERVICE_POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_SERVICE_POSTGRES_DB}
      DB_USERNAME: ${AUTH_SERVICE_POSTGRES_USER}
      DB_PASSWORD: ${AUTH_SERVICE_POSTGRES_PASSWORD}

      USER_SERVICE_URL: ${USER_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${AUTH_SERVICE_SERVICE_PORT}:${AUTH_SERVICE_SERVICE_PORT}"
    restart: unless-stopped


  # =========================
  # Order Service
  # =========================

  order-postgres:
    image: postgres:17
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: ${ORDER_SERVICE_POSTGRES_DB}
      POSTGRES_USER: ${ORDER_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_SERVICE_POSTGRES_PASSWORD}
    ports:
      - "${ORDER_SERVICE_POSTGRES_PORT}:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ORDER_SERVICE_POSTGRES_USER} -d ${ORDER_SERVICE_POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    depends_on:
      order-postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://order-postgres:5432/${ORDER_SERVICE_POSTGRES_DB}
      DB_USERNAME: ${ORDER_SERVICE_POSTGRES_USER}
      DB_PASSWORD: ${ORDER_SERVICE_POSTGRES_PASSWORD}

      USER_SERVICE_URL: ${USER_SERVICE_URL}

      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${ORDER_SERVICE_SERVICE_PORT}:${ORDER_SERVICE_SERVICE_PORT}"
    restart: unless-stopped


  # =========================
  # API Gateway
  # =========================

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SERVICES_ADDRESS_PREFIX: ${SERVICES_ADDRESS_PREFIX}

      USER_SERVICE_SERVICE_HOST: ${USER_SERVICE_SERVICE_HOST}
      ORDER_SERVICE_SERVICE_HOST: ${ORDER_SERVICE_SERVICE_HOST}
      AUTH_SERVICE_SERVICE_HOST: ${AUTH_SERVICE_SERVICE_HOST}
      
      USER_SERVICE_PORT: ${USER_SERVICE_SERVICE_PORT}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_SERVICE_PORT}
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_SERVICE_PORT}

      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${API_GATEWAY_SERVICE_PORT}:${API_GATEWAY_SERVICE_PORT}"
    restart: unless-stopped


# =========================
# Volumes
# =========================

volumes:
  user_postgres_data:
  auth_postgres_data:
  order_postgres_data: