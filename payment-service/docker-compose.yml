services:

  payment-service:
    build: .
    ports:
      - "${PAYMENT_SERVICE_SERVICE_PORT}:${PAYMENT_SERVICE_SERVICE_PORT}"
    environment:
      MONGODB_URI: mongodb://${PAYMENT_SERVICE_MONGO_INITDB_ROOT_USERNAME}:${PAYMENT_SERVICE_MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${PAYMENT_SERVICE_MONGO_INITDB_DATABASE}?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: payment-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PAYMENT_SERVICE_MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_SERVICE_MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${PAYMENT_SERVICE_MONGO_INITDB_DATABASE}
    ports:
      - "${PAYMENT_SERVICE_MONGO_PORT}:27017"
    volumes:
      - payment_mongo_data:/data/db

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  payment_mongo_data:
  kafka_data: