databaseChangeLog:
  - changeSet:
      id: 002-create-refresh-tokens-schema
      author: eklyndyuk
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                    name: expires_at
                    type: timestamp
                    constraints:
                        nullable: false
              - column:
                    name: revoked_at
                    type: timestamp
                    constraints:
                        nullable: true
              - column:
                    name: replaced_by
                    type: uuid
                    constraints:
                        nullable: true
