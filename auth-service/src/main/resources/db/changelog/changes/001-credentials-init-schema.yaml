databaseChangeLog:
  - changeSet: 
      id: 001-create-credentials-schema
      author: eklyndyuk
      changes:
        - sql:
            sql: |
              CREATE TYPE role_variant AS ENUM('ROLE_USER', 'ROLE_ADMIN');
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: varchar(100)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: role_variant
                  constraints:
                    nullable: false

