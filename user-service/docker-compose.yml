services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8
    container_name: user-service-redis
    ports:
      - "6379:6379"
volumes:
  postgres_data: